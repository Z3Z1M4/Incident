<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incident - Incident Capture</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, sans-serif;
      background-color: #1c1c1e;
      color: white;
      padding: 20px;
      max-width: 500px;
      margin: 0 auto;
    }
    a { color: #0a84ff; text-decoration: none; font-size: 16px; }
    h2 { font-size: 18px; margin-top: 30px; }
    .card {
      background: #2c2c2e;
      padding: 16px;
      border-radius: 12px;
      margin-top: 16px;
    }
    .label { color: #8e8e93; font-size: 13px; }
    .value { font-size: 17px; margin-bottom: 12px; }
    .timeline-item {
      border-left: 2px solid #ff453a;
      padding-left: 12px;
      margin-bottom: 12px;
    }
    #incident-title-input {
      width: 100%;
      font-size: 24px;
      font-weight: 700;
      background: none;
      border: none;
      color: white;
      margin-top: 16px;
      padding: 8px 0;
      border-bottom: 2px solid transparent;
    }
    #incident-title-input:focus {
      outline: none;
      border-bottom: 2px solid #ff453a;
    }
    #incident-notes {
      width: 100%;
      min-height: 140px;
      background: #2c2c2e;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-family: inherit;
      margin-top: 10px;
      resize: vertical;
    }
    #incident-notes:focus {
      outline: 2px solid #ff453a;
    }
    #save-status {
      font-size: 13px;
      color: #8e8e93;
      height: 18px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <a href="index.html">&larr; Terug</a>
  <input id="incident-title-input" placeholder="Titel..." disabled>

  <div class="card">
    <div class="label">Datum en uur</div>
    <div class="value" id="incident-datetime">-</div>
    <div class="label">Locatie</div>
    <div class="value" id="incident-location">-</div>
  </div>

  <h2>Notities</h2>
  <textarea id="incident-notes" placeholder="Voeg hier notities toe..." disabled></textarea>
  <div id="save-status"></div>

  <h2>Tijdlijn</h2>
  <div id="timeline">Laden...</div>

  <script>
    const SUPABASE_URL = "https://uvbsjnzarddzwudqvheb.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV2YnNqbnphcmRkend1ZHF2aGViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4Nzg4MjMsImV4cCI6MjEwMTQ1NDgyM30.Yg9cGj3c3ZiT9FTHgtt7ilqWlQpYUqHX9A1D7hC9kms";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const params = new URLSearchParams(window.location.search);
    const incidentId = params.get('id');

    const titleInput = document.getElementById('incident-title-input');
    const notesInput = document.getElementById('incident-notes');
    const saveStatus = document.getElementById('save-status');

    let laatstOpgeslagenTitel = "";
    let laatstOpgeslagenNotes = "";
    let titleTimer = null;
    let notesTimer = null;

    async function laadIncident() {
      if (!incidentId) {
        titleInput.placeholder = "Geen incident gevonden.";
        return;
      }

      const { data: incident, error } = await supabaseClient
        .from('incidents')
        .select('*')
        .eq('id', incidentId)
        .single();

      if (error || !incident) {
        titleInput.placeholder = "Incident niet gevonden.";
        return;
      }

      titleInput.value = incident.title || "";
      laatstOpgeslagenTitel = incident.title || "";
      titleInput.disabled = false;

      notesInput.value = incident.notes || "";
      laatstOpgeslagenNotes = incident.notes || "";
      notesInput.disabled = false;

      const datum = new Date(incident.created_at);
      document.getElementById('incident-datetime').textContent = datum.toLocaleString('nl-BE');

      if (incident.street) {
        document.getElementById('incident-location').textContent = incident.street;
      } else if (incident.latitude && incident.longitude) {
        document.getElementById('incident-location').textContent =
          incident.latitude.toFixed(5) + ", " + incident.longitude.toFixed(5);
      } else {
        document.getElementById('incident-location').textContent = "Onbekend";
      }

      laadTijdlijn();
    }

    async function laadTijdlijn() {
      const { data: events, error } = await supabaseClient
        .from('timeline_events')
        .select('*')
        .eq('incident_id', incidentId)
        .order('created_at', { ascending: false });

      const timelineEl = document.getElementById('timeline');
      timelineEl.innerHTML = '';

      if (error || !events || events.length === 0) {
        timelineEl.textContent = "Nog geen gebeurtenissen.";
        return;
      }

      events.forEach(event => {
        const item = document.createElement('div');
        item.className = 'timeline-item';
        const tijd = new Date(event.created_at).toLocaleTimeString('nl-BE', { hour: '2-digit', minute: '2-digit' });
        item.innerHTML = '<strong>' + tijd + '</strong><br>' + event.event_text;
        timelineEl.appendChild(item);
      });
    }

    async function slaTitelOp() {
      const nieuweWaarde = titleInput.value.trim();
      if (nieuweWaarde === laatstOpgeslagenTitel) return;

      saveStatus.textContent = "Opslaan...";
      await supabaseClient
        .from('incidents')
        .update({ title: nieuweWaarde, updated_at: new Date().toISOString() })
        .eq('id', incidentId);

      await supabaseClient
        .from('timeline_events')
        .insert({ incident_id: incidentId, event_text: "Titel aangepast" });

      laatstOpgeslagenTitel = nieuweWaarde;
      saveStatus.textContent = "Opgeslagen";
      laadTijdlijn();
      setTimeout(() => { saveStatus.textContent = ""; }, 2000);
    }

    async function slaNotitieOp() {
      const nieuweWaarde = notesInput.value.trim();
      if (nieuweWaarde === laatstOpgeslagenNotes) return;

      saveStatus.textContent = "Opslaan...";
      await supabaseClient
        .from('incidents')
        .update({ notes: nieuweWaarde, updated_at: new Date().toISOString() })
        .eq('id', incidentId);

      await supabaseClient
        .from('timeline_events')
        .insert({ incident_id: incidentId, event_text: "Notitie aangepast" });

      laatstOpgeslagenNotes = nieuweWaarde;
      saveStatus.textContent = "Opgeslagen";
      laadTijdlijn();
      setTimeout(() => { saveStatus.textContent = ""; }, 2000);
    }

    titleInput.addEventListener('input', () => {
      clearTimeout(titleTimer);
      titleTimer = setTimeout(slaTitelOp, 1500);
    });
    titleInput.addEventListener('blur', slaTitelOp);

    notesInput.addEventListener('input', () => {
      clearTimeout(notesTimer);
      notesTimer = setTimeout(slaNotitieOp, 1500);
    });
    notesInput.addEventListener('blur', slaNotitieOp);

    laadIncident();
  </script>
</body>
</html>
