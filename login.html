<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inloggen - Incident Capture</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, sans-serif;
  background-color: #1c1c1e;
  color: white;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
h1 { font-size: 26px; margin-bottom: 30px; }
.form { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; }
input {
  background: #2c2c2e;
  color: white;
  border: none;
  border-radius: 12px;
  padding: 16px;
  font-size: 16px;
}
input:focus { outline: 2px solid #ff453a; }
button {
  background-color: #ff453a;
  color: white;
  border: none;
  border-radius: 12px;
  padding: 16px;
  font-size: 17px;
  font-weight: 600;
  cursor: pointer;
}
button:disabled { opacity: 0.5; }
#error { color: #ff453a; font-size: 14px; min-height: 18px; text-align: center; }
</style>
</head>
<body>
<h1>Incident Capture</h1>
<div class="form">
  <input type="email" id="email" placeholder="E-mailadres" autocomplete="username">
  <input type="password" id="password" placeholder="Wachtwoord" autocomplete="current-password">
  <div id="error"></div>
  <button id="login-btn">Inloggen</button>
</div>

<script>
const SUPABASE_URL = "https://uvbsjnzarddzwudqvheb.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV2YnNqbnphcmRkend1ZHF2aGViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4Nzg4MjMsImV4cCI6MjEwMTQ1NDgyM30.Yg9cGj3c3ZiT9FTHgtt7ilqWlQpYUqHX9A1D7hC9kms";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const errorEl = document.getElementById('error');
const loginBtn = document.getElementById('login-btn');

async function checkAlIngelogd() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) window.location.href = 'index.html';
}
checkAlIngelogd();

async function login() {
  errorEl.textContent = "";
  loginBtn.disabled = true;

  const { error } = await supabaseClient.auth.signInWithPassword({
    email: emailInput.value.trim(),
    password: passwordInput.value
  });

  if (error) {
    errorEl.textContent = "Inloggen mislukt: verkeerd e-mailadres of wachtwoord.";
    loginBtn.disabled = false;
    return;
  }

  window.location.href = 'index.html';
}

loginBtn.addEventListener('click', login);
passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
</script>
</body>
</html>
