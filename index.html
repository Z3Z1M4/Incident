<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incident Capture</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, sans-serif;
      background-color: #1c1c1e;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    h1 { font-size: 28px; margin-bottom: 40px; text-align: center; }
    .menu {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    button, .btn-link {
      font-size: 20px;
      font-weight: 600;
      padding: 24px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: block;
    }
    button:disabled { opacity: 0.5; }
    .btn-primary { background-color: #ff453a; color: white; }
    .btn-secondary { background-color: #2c2c2e; color: white; }
    .btn-orange { background-color: #ff9500; color: white; }
    #status {
      margin-top: 20px;
      color: #8e8e93;
      text-align: center;
      max-width: 400px;
    }
  </style>
</head>
<body>
  <h1>Incident Capture</h1>
  <div class="menu">
    <button class="btn-primary" id="btn-nieuw-incident">Nieuw incident</button>
    <button class="btn-orange" id="btn-snelle-notitie">Snelle notitie</button>
    <a class="btn-secondary btn-link" href="recent.html">Recente incidenten</a>
  </div>
  <p id="status"></p>

  <script>
    const SUPABASE_URL = "https://uvbsjnzarddzwudqvheb.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV2YnNqbnphcmRkend1ZHF2aGViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4Nzg4MjMsImV4cCI6MjEwMTQ1NDgyM30.Yg9cGj3c3ZiT9FTHgtt7ilqWlQpYUqHX9A1D7hC9kms";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const statusEl = document.getElementById('status');

    function haalLocatieOp() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) { resolve(null); return; }
        navigator.geolocation.getCurrentPosition(
          (position) => resolve({ lat: position.coords.latitude, lng: position.coords.longitude }),
          () => resolve(null)
        );
      });
    }

    async function zoekStraatnaam(lat, lng) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 6000);
        const response = await fetch(
          `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`,
          { signal: controller.signal }
        );
        clearTimeout(timeoutId);
        const data = await response.json();
        const adres = data.address || {};
        const straat = adres.road || adres.pedestrian || adres.footway || "";
        const nummer = adres.house_number || "";
        if (straat && nummer) return straat + " " + nummer;
        if (straat) return straat;
        return null;
      } catch (e) {
        return null;
      }
    }

    // Nieuw incident
    const btnIncident = document.getElementById('btn-nieuw-incident');
    btnIncident.addEventListener('click', async () => {
      btnIncident.disabled = true;
      statusEl.textContent = "Locatie ophalen...";
      const locatie = await haalLocatieOp();

      let straatnaam = null;
      if (locatie) {
        statusEl.textContent = "Adres opzoeken...";
        straatnaam = await zoekStraatnaam(locatie.lat, locatie.lng);
      }

      statusEl.textContent = "Incident aanmaken...";
      const nieuwIncident = {
        latitude: locatie ? locatie.lat : null,
        longitude: locatie ? locatie.lng : null,
        street: straatnaam
      };
      if (straatnaam) nieuwIncident.title = straatnaam;

      const { data: incident, error } = await supabaseClient
        .from('incidents').insert(nieuwIncident).select().single();

      if (error) {
        statusEl.textContent = "Er ging iets mis: " + error.message;
        btnIncident.disabled = false;
        return;
      }

      await supabaseClient
        .from('timeline_events')
        .insert({ incident_id: incident.id, event_text: "Incident aangemaakt" });

      window.location.href = "incident.html?id=" + incident.id;
    });

    // Snelle notitie
    const btnNotitie = document.getElementById('btn-snelle-notitie');
    btnNotitie.addEventListener('click', async () => {
      btnNotitie.disabled = true;
      statusEl.textContent = "Locatie ophalen...";
      const locatie = await haalLocatieOp();

      let straatnaam = null;
      if (locatie) {
        statusEl.textContent = "Adres opzoeken...";
        straatnaam = await zoekStraatnaam(locatie.lat, locatie.lng);
      }

      statusEl.textContent = "Notitie aanmaken...";
      const { data: note, error } = await supabaseClient
        .from('quick_notes')
        .insert({
          latitude: locatie ? locatie.lat : null,
          longitude: locatie ? locatie.lng : null,
          street: straatnaam
        })
        .select().single();

      if (error) {
        statusEl.textContent = "Er ging iets mis: " + error.message;
        btnNotitie.disabled = false;
        return;
      }

      window.location.href = "quicknote.html?id=" + note.id;
    });
  </script>
</body>
</html>
