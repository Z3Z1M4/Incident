<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incident Capture</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, sans-serif;
      background-color: #1c1c1e;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    h1 { font-size: 28px; margin-bottom: 40px; text-align: center; }
    .menu {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    button {
      font-size: 20px;
      font-weight: 600;
      padding: 24px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; }
    .btn-primary { background-color: #ff453a; color: white; }
    .btn-secondary { background-color: #2c2c2e; color: white; }
    #status {
      margin-top: 20px;
      color: #8e8e93;
      text-align: center;
      max-width: 400px;
    }
  </style>
</head>
<body>
  <h1>Incident Capture</h1>
  <div class="menu">
    <button class="btn-primary" id="btn-nieuw-incident">Nieuw incident</button>
    <button class="btn-secondary">Snelle notitie</button>
    <button class="btn-secondary">Recente incidenten</button>
  </div>
  <p id="status"></p>

  <script>
    const SUPABASE_URL = "https://uvbsjnzarddzwudqvheb.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV2YnNqbnphcmRkend1ZHF2aGViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4Nzg4MjMsImV4cCI6MjEwMTQ1NDgyM30.Yg9cGj3c3ZiT9FTHgtt7ilqWlQpYUqHX9A1D7hC9kms";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const btn = document.getElementById('btn-nieuw-incident');
    const statusEl = document.getElementById('status');

    btn.addEventListener('click', () => {
      btn.disabled = true;
      statusEl.textContent = "Locatie ophalen...";

      if (!navigator.geolocation) {
        statusEl.textContent = "Locatie is niet beschikbaar in deze browser.";
        maakIncidentAan(null, null);
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          maakIncidentAan(position.coords.latitude, position.coords.longitude);
        },
        () => {
          statusEl.textContent = "Kon locatie niet ophalen, incident wordt zonder locatie aangemaakt.";
          maakIncidentAan(null, null);
        }
      );
    });

    async function zoekStraatnaam(lat, lng) {
      try {
        const response = await fetch(
          `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`
        );
        const data = await response.json();
        const adres = data.address || {};

        const straat = adres.road || adres.pedestrian || adres.footway || "";
        const nummer = adres.house_number || "";

        if (straat && nummer) return straat + " " + nummer;
        if (straat) return straat;
        return null;
      } catch (e) {
        return null;
      }
    }

    async function maakIncidentAan(lat, lng) {
      statusEl.textContent = "Incident aanmaken...";

      let straatnaam = null;
      if (lat && lng) {
        statusEl.textContent = "Adres opzoeken...";
        straatnaam = await zoekStraatnaam(lat, lng);
      }

      const nieuwIncident = {
        latitude: lat,
        longitude: lng,
        street: straatnaam
      };

      if (straatnaam) {
        nieuwIncident.title = straatnaam;
      }

      const { data: incident, error } = await supabaseClient
        .from('incidents')
        .insert(nieuwIncident)
        .select()
        .single();

      if (error) {
        statusEl.textContent = "Er ging iets mis: " + error.message;
        btn.disabled = false;
        return;
      }

      await supabaseClient
        .from('timeline_events')
        .insert({ incident_id: incident.id, event_text: "Incident aangemaakt" });

      window.location.href = "incident.html?id=" + incident.id;
    }
  </script>
</body>
