<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Incident Capture</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: -apple-system, sans-serif;
      background-color: #1c1c1e;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 40px;
      text-align: center;
    }
    .menu {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    button {
      font-size: 20px;
      font-weight: 600;
      padding: 24px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
    }
    .btn-primary {
      background-color: #ff453a;
      color: white;
    }
    .btn-secondary {
      background-color: #2c2c2e;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Incident Capture</h1>
  <div class="menu">
    <button class="btn-primary">Nieuw incident</button>
    <button class="btn-secondary">Snelle notitie</button>
    <button class="btn-secondary">Recente incidenten</button>
  </div>
</body>
</html>
